name: Refresh data & deploy to GitHub Pages

# 触发方式：
#   push / 定时（每 6 小时）/ 手动 Run workflow（可勾选 Force refresh）
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略缓存，强制重新抓取源数据'
        type: boolean
        default: false

permissions:
  contents: write      # 用于把刷新后的数据自动提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 缓存抓到的原始页面：TTL 内（默认 12h）直接复用，避免频繁请求上游
      - name: Restore page cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: aa-page-${{ github.run_id }}
          restore-keys: aa-page-

      - name: Refresh model data
        run: npm run refresh -- ${{ inputs.force && '--force' || '' }}

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain src/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "chore(data): refresh Artificial Analysis snapshot [skip ci]"
            git push
          else
            echo "数据无变化，跳过提交"
          fi

      - name: Build site
        run: |
          npm run build
          touch dist/.nojekyll
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "event: ${GITHUB_EVENT_NAME}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > dist/BUILD_INFO.txt

      # 把构建产物镜像到 gh-pages 分支：仓库里同时保留源码（main）与可直接托管的静态文件。
      # 该分支始终是一个孤立的单提交，每次运行强制覆盖，不参与主线开发。
      - name: Mirror static build to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "chore(static): build from ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
